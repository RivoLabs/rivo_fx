<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: transparent; }
      #shop { display: none; position: absolute; top: 30%; left: 50%; transform: translateX(-50%); width: 320px;
              padding: 16px; border-radius: 10px; background: #111c; color: #eee; }
      #shop.open { display: block; }
      button { margin: 4px 4px 0 0; }
      #status { margin-top: 10px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="shop">
      <div id="items"></div>
      <label>Qty <input id="qty" type="number" value="1" min="1" max="10" /></label>
      <div id="status"></div>
      <button id="close">Close</button>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
