<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rivo FX devtools</title>
    <link rel="stylesheet" href="devtools.css" />
  </head>
  <body>
    <div id="app" class="shell" hidden>
      <aside class="side">
        <div class="brand">
          <svg class="logo" viewBox="82 326 1758 447" role="img" aria-label="Rivo"><path d="M211.78,574.2l-71.85,70.92-14.62,14.44h-37.1c-4.76,0-7.14-5.67-3.77-8.99l30.98-30.61,49.9-49.26c6.32-6.23,6.32-16.34,0-22.59l-59.58-58.8c-8.73-8.62-2.56-23.36,9.8-23.36h19.51l76.73,75.73c9.08,8.98,9.08,23.54,0,32.52Z" fill="var(--rivo-chevron-back, #6D93E0)"></path><path d="M282.03,559.41c0,1.35-.52,2.7-1.56,3.74l-96.13,94.88c-1,.99-2.37,1.54-3.78,1.54h-55.26l14.62-14.44,71.85-70.92c9.09-8.98,9.09-23.54,0-32.52l-76.73-75.73h52.3c1.42,0,2.78.56,3.78,1.55l89.34,88.19c1.04,1.02,1.56,2.37,1.56,3.72Z" fill="var(--rivo-chevron-front, #2B6ED4)"></path><path d="M537.51,772.67h-101.59l-77.2-73.51-35.85-34.13,26.32-26.33h86.72v-208.23h-182.09l129.15,127.47-5.43,5.38-140.64,138.82H82.2l43.1-42.56h55.26c1.42,0,2.78-.56,3.78-1.54l96.13-94.89c1.03-1.03,1.55-2.38,1.55-3.74s-.52-2.69-1.55-3.72l-89.35-88.2c-1-.98-2.37-1.54-3.78-1.54h-52.3l-22.18-21.89c-7.72-7.62-2.25-20.66,8.68-20.66h113.31v-97.03h215.65v83.79h89.51v213.98c0,12.73-10.27,23.08-23,23.18l-64.08.53,51.28,51.29h.01l44.72,44.74c10.95,10.36,3.62,28.78-11.45,28.78Z" fill="var(--rivo-mark-body, #F2F6FB)"></path><path d="M937.25,419.59l-25.86-16.91h-286.69v293.68h93.68v-107.44h70.76l51.39,107.44h95.81l-60.7-119.54,61.6-40.61v-116.63h0ZM843.53,512.43l-20.3,14h-104.85v-97.04h104.85l20.3,14v69.05h0Z" fill="var(--rivo-mark-body, #F2F6FB)"></path><path d="M1003.41,402.68v293.68h93.68v-293.68h-93.68Z" fill="var(--rivo-mark-body, #F2F6FB)"></path><path d="M1378.01,402.68l-62.71,211-63.28-211h-96.65l96.23,293.68h126.75l96.2-293.68h-96.53Z" fill="var(--rivo-mark-body, #F2F6FB)"></path><path d="M1813.61,402.68h-260.85l-25.83,16.91v264.52l18.74,12.26h275.03l18.74-12.26v-264.52l-25.83-16.91ZM1745.76,660.32l-20.3,14.48h-84.52l-20.33-14.48v-216.94l20.33-14h84.52l20.3,14v216.94Z" fill="var(--rivo-mark-body, #F2F6FB)"></path></svg>
          <span class="sub">FX devtools</span>
        </div>
        <div class="group-label">Inspect</div>
        <nav id="tabs" class="nav" aria-label="Views"></nav>
        <div class="side-foot">
          <div id="live" class="live"><span class="dot"></span><span id="updated">Waiting</span></div>
          <div class="foot-row">
            <button id="pause" class="btn" type="button">Pause</button>
            <button id="theme" class="btn icon" type="button" aria-label="Switch to light theme" title="Switch theme">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            </button>
          </div>
          <div class="hint"><kbd>Esc</kbd> to close <span aria-hidden="true">&middot;</span> <kbd>/</kbd> to filter</div>
        </div>
      </aside>
      <section class="content">
        <header class="head">
          <div>
            <h1 id="title">Overview</h1>
            <p id="subtitle"></p>
          </div>
          <div class="tools">
            <div id="side" class="seg" role="group" aria-label="Side">
              <button type="button" data-side="all" class="active">All</button>
              <button type="button" data-side="server">Server</button>
              <button type="button" data-side="client">Client</button>
            </div>
            <label class="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <input id="filter" type="search" placeholder="Filter by resource or name" aria-label="Filter" />
            </label>
            <button id="close" class="btn icon" type="button" aria-label="Close" title="Close (Esc)">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
          </div>
        </header>
        <main id="main"></main>
      </section>
    </div>
    <script src="devtools.js"></script>
  </body>
</html>
